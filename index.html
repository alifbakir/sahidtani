<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- Menambahkan favicon dari folder public -->
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64x64.png" />
    <link rel="icon" type="image/png" href="/LOGONOBG.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#156a3e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08150f" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Sahid Tani — pusat bibit buah unggul di Salatiga. Bibit durian, alpukat, mangga, jeruk, dan lainnya, siap kirim ke seluruh Indonesia."
    />
    <title>Sahid Tani — Pusat Bibit Buah Unggul</title>
    <!-- PWA: Safari/iOS tidak membaca manifest sepenuhnya, jadi ditulis manual. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sahid Tani" />
    <script>
      // Pasang tema sebelum halaman digambar supaya tidak berkedip putih di mode gelap.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
